name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python tool/verify_upstream.py
      - run: python tool/native_build.py test
      - run: python tool/native_build.py library
      - run: python tool/check_exported_symbols.py
      - name: Bounded fuzz (ASan and UBSan)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          CC="$(brew --prefix llvm)/bin/clang" python tool/native_build.py fuzz
          mkdir -p build/fuzz-corpus
          cp test/fixtures/*.gif build/fuzz-corpus/
          build/native/fuzz -max_total_time=60 -timeout=10 -rss_limit_mb=1024 build/fuzz-corpus
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib hook test example/lib example/integration_test
      - run: dart analyze
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test test
        working-directory: example
      - run: dart test
      - name: Verify generated sources
        if: runner.os == 'macOS'
        run: |
          dart run ffigen --config ffigen.yaml
          python tool/generate_cli_manifest.py
          dart format lib/src/cli_manifest.dart
          git diff --exit-code -- lib/src/bindings lib/src/cli_manifest.dart tool/cli src/bridge/capabilities.inc
      - run: flutter build macos --release
        working-directory: example
        if: runner.os == 'macOS'
      - run: flutter test integration_test/gifsicle_integration_test.dart -d macos
        working-directory: example
        if: runner.os == 'macOS'
      - run: flutter test integration_test/demo_test.dart -d macos
        working-directory: example
        if: runner.os == 'macOS'
      - run: flutter build ios --simulator --debug
        working-directory: example
        if: runner.os == 'macOS'
      - run: flutter build ios --release --no-codesign
        working-directory: example
        if: runner.os == 'macOS'
      - run: flutter build windows --release
        working-directory: example
        if: runner.os == 'Windows'
      - run: flutter test integration_test/gifsicle_integration_test.dart -d windows
        working-directory: example
        if: runner.os == 'Windows'
      - run: flutter test integration_test/demo_test.dart -d windows
        working-directory: example
        if: runner.os == 'Windows'
      - name: Blank consumer with only a path dependency
        run: python tool/verify_consumer.py
  android-build:
    name: Android build (APK, AAB and 16 KB alignment)
    # Ubuntu is the build host; the target is Android, not Linux desktop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --release --target-platform android-arm64,android-x64
        working-directory: example
      - run: flutter build appbundle --release --target-platform android-arm64,android-x64
        working-directory: example
      - run: python tool/check_android_alignment.py example/build/app/outputs/flutter-apk/app-release.apk
      - name: Blank Android consumer with only a path dependency
        run: python tool/verify_consumer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            tool/reports/
            example/build/app/outputs/flutter-apk/*.apk
            example/build/app/outputs/bundle/release/*.aab
  android-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/run_android_integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-logs
          path: tool/reports/android/
  android-16k-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/run_android_integration.sh 16k
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16k-runtime-logs
          path: tool/reports/android/
